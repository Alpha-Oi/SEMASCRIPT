name: Compile

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compileall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Syntax-only guard. The bundle has no dependency manifest and its browser
      # checks need Playwright, so functional suites stay out of CI for now.
      - name: Byte-compile the bundle
        run: python -m compileall -q .
